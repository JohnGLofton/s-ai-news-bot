name: Daily Study Abroad News Digest

on:
  # Run daily at 1:00 AM UTC (9:00 AM Beijing Time)
  schedule:
    - cron: "0 1 * * *"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-and-send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send study abroad news digest
        env:
          # ============================================
          # LLM Provider Configuration
          # ============================================
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          # ============================================
          # Notification Configuration
          # Set NOTIFICATION_METHODS=resend to use Resend
          # ============================================
          NOTIFICATION_METHODS: ${{ secrets.NOTIFICATION_METHODS }}

          # Resend Email (recommended)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Sender address - must be verified in Resend dashboard
          # Free tier: use onboarding@resend.dev for testing
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Recipient(s) - comma-separated for multiple people
          # e.g. alice@example.com,bob@example.com
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Gmail fallback (optional)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Other notification channels (optional)
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # ============================================
          # Language Settings
          # e.g. en  or  zh  or  en,zh
          # ============================================
          AI_RESPONSE_LANGUAGE: ${{ secrets.AI_RESPONSE_LANGUAGE }}

          ENABLE_WEB_SEARCH: "false"

        run: |
          python main.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
