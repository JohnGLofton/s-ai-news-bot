# Study Abroad News Bot Configuration
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  provider: deepseek
  # model: deepseek-chat

news:
  enable_web_search: false
  max_items_per_source: 10

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior news editor and international education consultant. Analyze the {total_items} news items above and select exactly 37 of the highest-quality items.

      ### SELECTION TARGETS BY CATEGORY (STRICTLY FOLLOW):
      - Exactly 5 items: Major international headline news (global politics, finance, technology - NOT study-abroad related)
      - Exactly 5 items: Major China domestic headline news (politics, economy, technology, society - NOT study-abroad related)
      - Exactly 10 items: US university news - famous US universities headlines, international student admissions, IELTS/TOEFL/SAT/ACT/Duolingo test news
      - Exactly 10 items: UK university news - famous UK universities headlines, international student admissions, language tests
      - Exactly 7 items: Study abroad visa and immigration policy news
      - Exactly 5 items: Other international education headline news (rankings, scholarships, etc.)

      ### CRITICAL RULES:
      - For 国际新闻 category: select general world news ONLY (NOT education/study abroad)
      - For 国内新闻 category: select China domestic news ONLY (NOT education/study abroad)
      - Do NOT put the same news in multiple categories
      - If there are not enough items in a category, still select the best available
      - Prioritize headline, trending, and breaking news
      - Prefer primary sources and official announcements

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of exactly 37 selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12", ...]

      CRITICAL: Select exactly 37 items total.

  # Stage 2: Summarization prompt template
  # Placeholders: {count}, {selected_news}
  stage2_prompt_template: |
      You are a senior news editor. Create a news digest in Chinese for the {count} pre-selected news items below.

      {selected_news}

      ## OUTPUT STRUCTURE:

      Organize ALL news items into these exact 6 categories with these exact headers (NO item count in brackets):

      ## 国际新闻
      ## 国内新闻
      ## 美国大学招生与国际学生
      ## 英国大学招生与国际学生
      ## 留学签证与移民政策
      ## 其他国际教育新闻

      Category guidelines:
      - 国际新闻: 5 items - global politics, finance, technology headline news (not required to be study-abroad related)
      - 国内新闻: 5 items - China domestic headline news (politics, economy, technology)
      - 美国大学招生与国际学生: 10 items - famous US university news, international admissions, IELTS/TOEFL/SAT/ACT/Duolingo
      - 英国大学招生与国际学生: 10 items - famous UK university news, international admissions, language tests
      - 留学签证与移民政策: 7 items - visa policy, immigration updates for students
      - 其他国际教育新闻: 5 items - rankings, scholarships, other education news

      ## CONTENT REQUIREMENTS:

      For each news item provide:
      1. **标题**: Clear Chinese headline
      2. **摘要**: 150-200 Chinese characters summary covering: what happened, key data/numbers, why it matters, implications for students
      3. **来源**: [来源名称](URL)

      ## WRITING STYLE:
      - All content in Chinese
      - Summaries must be 150-200 Chinese characters (strictly enforced)
      - Include specific numbers, dates, policy names
      - Student-oriented perspective

      ## QUALITY REQUIREMENTS:
      - ✅ Summarize ALL {count} items (no skipping)
      - ✅ Each summary strictly 150-200 Chinese characters
      - ✅ All sources as clickable markdown links
      - ✅ Use all 6 category headers exactly as written above
      - ✅ NO item count numbers in category headers

      ## AVOID:
      ❌ Summaries outside 150-200 character range
      ❌ Missing clickable links
      ❌ Skipping any news items
      ❌ Adding count numbers like （5条） to headers
      ❌ Adding extra categories

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
