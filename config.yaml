# Study Abroad News Bot Configuration
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  provider: deepseek
  # model: deepseek-chat

news:
  enable_web_search: false
  max_items_per_source: 10

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior international education consultant and analyst. Analyze the {total_items} news items above and select exactly 15-20 of the highest-quality items relevant to international study abroad.

      ### SELECTION CRITERIA:
      - ✅ US/UK university admissions policies and changes for international students
      - ✅ Major headline news about international student applications and enrollment trends
      - ✅ Study abroad visa policies and immigration updates (US F-1, UK Tier 4/Student visa, etc.)
      - ✅ Language test news: IELTS, TOEFL, SAT, ACT, Duolingo English Test updates and policy changes
      - ✅ Global university ranking news: QS, Times Higher Education (THE), ARWU updates
      - ✅ Scholarship and funding opportunities for international students
      - ✅ Include both international and domestic (language-specific) news when available
      - ✅ Prefer primary sources over secondary reporting

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12", ...]

      CRITICAL: Select exactly 15-20 items. No more, no less.

  # Stage 2: Summarization prompt template
  # Placeholders: {count}, {selected_news}
  stage2_prompt_template: |
      You are a senior international education consultant. Create a study abroad news digest for the {count} pre-selected news items below.

      {selected_news}

      ## OUTPUT STRUCTURE:

      Organize news items into these fixed categories (include ALL categories in output, show count in header):
      1. **国际新闻**（7条）- General international education news
      2. **国内新闻**（7条）- China domestic study abroad news
      3. **美国大学招生与国际学生**（10条）- US university admissions and international students
      4. **英国大学招生与国际学生**（10条）- UK university admissions and international students
      5. **留学签证与移民政策**（7条）- Study abroad visa and immigration policy
      6. **其他国际教育新闻**（7条）- Other international education news

      Distribute the {count} items across these categories as evenly as possible.
      If a category has fewer items than the target, show what is available.

      ## CONTENT REQUIREMENTS:

      For each news item, provide:
      1. **Clear Headline**: Informative title
      2. **Summary**: Exactly 50 Chinese characters. No more, no less.
      3. **Source Attribution**: [Source Name](URL)

      ## WRITING STYLE:
      - Summaries must be in Chinese and exactly 50 characters
      - Include key facts, numbers, and dates within the 50 characters
      - Be concise and information-dense

      ## QUALITY REQUIREMENTS:
      - ✅ Summarize ALL {count} items (no skipping)
      - ✅ Each summary exactly 50 Chinese characters
      - ✅ All sources as clickable markdown links
      - ✅ Use all 6 category headers even if some have fewer items

      ## AVOID:
      ❌ Summaries not equal to 50 characters
      ❌ Missing clickable links
      ❌ Skipping any news items
      ❌ Adding extra categories

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
