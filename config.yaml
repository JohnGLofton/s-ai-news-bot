# Study Abroad News Bot Configuration
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  provider: deepseek
  # model: deepseek-chat

news:
  enable_web_search: false
  max_items_per_source: 10

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior international education consultant and analyst. Analyze the {total_items} news items above and select exactly 15-20 of the highest-quality items relevant to international study abroad.

      ### SELECTION CRITERIA:
      - ✅ US/UK university admissions policies and changes for international students
      - ✅ Major headline news about international student applications and enrollment trends
      - ✅ Study abroad visa policies and immigration updates (US F-1, UK Tier 4/Student visa, etc.)
      - ✅ Language test news: IELTS, TOEFL, SAT, ACT, Duolingo English Test updates and policy changes
      - ✅ Global university ranking news: QS, Times Higher Education (THE), ARWU updates
      - ✅ Scholarship and funding opportunities for international students
      - ✅ Include both international and domestic (language-specific) news when available
      - ✅ Prefer primary sources over secondary reporting

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12", ...]

      CRITICAL: Select exactly 15-20 items. No more, no less.

  # Stage 2: Summarization prompt template
  # Placeholders: {count}, {selected_news}
  stage2_prompt_template: |
      You are a senior international education consultant. Create a comprehensive, in-depth study abroad news digest for the {count} pre-selected news items below.

      {selected_news}

      ## OUTPUT STRUCTURE:

      Organize news items into relevant categories (use only categories that have news):
      1. **US University Admissions & International Students** - Application policies, enrollment data, campus news
      2. **UK University Admissions & International Students** - UCAS updates, university policies, visa news
      3. **Study Abroad Visa & Immigration Policy** - F-1, Student visa, OPT/STEM OPT, Graduate Route updates
      4. **Language Tests** - IELTS, TOEFL, SAT, ACT, Duolingo English Test score changes and policies
      5. **Global University Rankings** - QS, THE, ARWU and other ranking announcements
      6. **Scholarships & Funding** - New scholarships, grants, financial aid for international students
      7. **Other International Education News** - Any other relevant study abroad developments

      ## CONTENT REQUIREMENTS:

      For each news item, provide:
      1. **Clear Headline**: Informative title capturing the key development
      2. **Analytical Summary (4-6 sentences)**:
         - What happened (core news and context)
         - Key details, deadlines, requirements, or metrics
         - Why it matters for international students or applicants
         - Practical implications or action items for students
      3. **Source Attribution**: Always include as clickable markdown link: [Source Name](URL)

      ## WRITING STYLE:
      - Practical, student-oriented tone accessible to applicants and families
      - Include specific numbers, deadlines, score requirements, and data points when available
      - Highlight action items or changes students need to be aware of
      - Balance accessibility with sufficient detail

      ## QUALITY REQUIREMENTS:
      - ✅ Summarize ALL {count} items provided above (no skipping)
      - ✅ Each summary must be exactly 4-6 sentences
      - ✅ Include specific numbers, dates, and requirements when available
      - ✅ Maintain balanced coverage across different categories
      - ✅ All sources must have clickable markdown links

      ## AVOID:
      ❌ Generic statements without specifics
      ❌ Summaries shorter than 4 sentences or longer than 6 sentences
      ❌ Missing clickable links
      ❌ Skipping any news items

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
