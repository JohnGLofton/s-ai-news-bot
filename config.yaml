# Study Abroad News Bot Configuration
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  provider: openai
  # model: accounts/hermes01025-beqn945p/deployments/gstp3a34

news:
  enable_web_search: false
  max_items_per_source: 10

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior news editor and international education consultant. Analyze the {total_items} news items above and select exactly 12 of the highest-quality items.

      ### MANDATORY SELECTION TARGETS BY CATEGORY:
      - Exactly 2 items: Major international headline news (global politics, finance, technology - NOT study-abroad related)
      - Exactly 2 items: Major China domestic headline news (politics, economy, technology, society - NOT study-abroad related)
      - Exactly 4 items: US university news - US universities, international student admissions, IELTS/TOEFL/SAT/ACT/Duolingo test news
      - Exactly 2 items: UK university news - UK universities (Oxford, Cambridge, Imperial, UCL, LSE etc.), UK international students, UK education policy
      - Exactly 1 item: Study abroad visa and immigration policy news (F1 visa, OPT, UK student visa, Australia/Canada study permit)
      - Exactly 1 item: Other international education headline news (rankings, scholarships, non-US/UK universities)

      ### CRITICAL RULES:
      - For 国际新闻: select general world news ONLY (NOT education/study abroad)
      - For 国内新闻: select China domestic news ONLY (NOT education/study abroad)
      - Do NOT put the same news in multiple categories
      - You MUST fill each category even if you need to use loosely related items
      - For UK category: use ANY news from UK sources (BBC, Guardian, TES, Wonkhe) or mentioning UK universities
      - For Visa category: use ANY news about immigration, visa policy, OPT, work permits for students
      - For Other Education: use rankings, scholarships, non-US/UK study destinations, education technology
      - If a category has fewer ideal matches, pick the closest available items from the news pool
      - Prioritize headline, trending, and breaking news

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of exactly 12 selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12", ...]

      CRITICAL: You MUST select exactly 12 items total, with items spread across ALL 6 categories.

  # Stage 2: Summarization prompt template (JSON output mode)
  # Placeholders: {count}, {selected_news}
  stage2_prompt_template: |
      {selected_news}

      ## YOUR TASK - STAGE 2: SUMMARIZE IN JSON FORMAT

      Create summaries for the {count} news items above. You MUST respond with ONLY a JSON array. No markdown formatting, no explanation, no thinking, no commentary.

      ## CATEGORIES (use these exact Chinese names):
      - "国际新闻" (2 items: global politics/finance/technology)
      - "国内新闻" (2 items: China domestic politics/economy/technology)
      - "美国大学招生与国际学生" (4 items: US universities, international admissions, IELTS/TOEFL/SAT/ACT)
      - "英国及国际教育新闻" (4 items: UK universities, visa policy, rankings, scholarships, other education)

      ## REQUIRED OUTPUT FORMAT (strict JSON):
      [
        {{
          "category": "国际新闻",
          "items": [
            {{
              "id": "INT-1",
              "title": "中文标题",
              "summary": "80-120字中文摘要，包含关键数据和意义",
              "source_name": "来源名称"
            }}
          ]
        }},
        {{
          "category": "国内新闻",
          "items": [...]
        }},
        {{
          "category": "美国大学招生与国际学生",
          "items": [...]
        }},
        {{
          "category": "英国及国际教育新闻",
          "items": [...]
        }}
      ]

      ## RULES:
      - Output ONLY the JSON array, nothing else
      - All 4 categories MUST appear, each with its items
      - Each summary: 80-120 Chinese characters
      - Include the original news ID in "id" field
      - All content in Chinese
      - No item count in category names

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
